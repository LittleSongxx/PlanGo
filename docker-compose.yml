name: plango

x-plango: &plango
  image: plango-harness:local
  build:
    context: .
    dockerfile: deploy/Dockerfile
  environment:
    PLANGO_RUNTIME_PROFILE: service
    PLANGO_BROWSER_VISION_ENABLED: ${PLANGO_BROWSER_VISION_ENABLED:-false}
    PLANGO_BACKEND_TOKEN: ${PLANGO_BACKEND_TOKEN:?Set PLANGO_BACKEND_TOKEN before starting PlanGo}
    PLANGO_DATABASE_URL: postgresql+asyncpg://plango:${PLANGO_POSTGRES_PASSWORD:?Set a URL-safe PLANGO_POSTGRES_PASSWORD}@postgres:5432/plango
    PLANGO_REDIS_URL: redis://redis:6379/0
    PLANGO_DATA_DIR: /data
    PLANGO_SKILLS_DIR: /app/skills
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
    AMAP_WEBSERVICE_KEY: ${AMAP_WEBSERVICE_KEY:-}
  volumes:
    - runtime-data:/data
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: plango
      POSTGRES_USER: plango
      POSTGRES_PASSWORD: ${PLANGO_POSTGRES_PASSWORD:?Set a URL-safe PLANGO_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U plango -d plango']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *plango
    command: [alembic, -c, alembic.ini, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *plango
    command: [python, -m, uvicorn, 'plango.app:create_app', --factory, --host, 0.0.0.0, --port, '8011', --no-access-log]
    ports:
      - '127.0.0.1:${PLANGO_SERVICE_PORT:-8011}:8011'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8011/api/v1/health/ready',headers={'Authorization':'Bearer '+os.environ['PLANGO_BACKEND_TOKEN']}); urllib.request.urlopen(r,timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  worker:
    <<: *plango
    command: [python, -m, plango.worker]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  runtime-data:
