[project]
name = "plango-harness"
version = "0.1.0"
description = "Multi-agent local-life planner built with LangGraph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "redis>=5,<8",
  "httpx>=0.28,<1",
  "openai>=1.60,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "pgvector>=0.3,<1",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["backend/agent", "backend/engines", "backend/world", "backend/tools", "backend/memory"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["backend/plango_harness"]
exclude = "(^|/)(backend/tests|backend/app\\.py|scripts/)"
ignore_missing_imports = true
check_untyped_defs = true
